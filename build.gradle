plugins {
    // Apply the spotless plugin before common.gradle.
    id 'com.diffplug.spotless' version '8.5.1' apply false
}

apply from: "${rootDir}/gradle/libraries.gradle"
apply from: "${rootDir}/gradle/common.gradle"

// ─── dependencies ─────────────────────────────────────────────────────────────
dependencies {
    api libraries.springFramework
    implementation libraries.springLogger
    api libraries.log4j
    api libraries.neasaaUtils
    implementation libraries.bouncycastleProvider
    api libraries.jackson
    api libraries.email
    implementation libraries.jdbcLibs
    implementation libraries.jasypt
}

// ─── jar ──────────────────────────────────────────────────────────────────────
jar {
    archiveBaseName.set('neasaa-base-app')
}

// ─── coverage ─────────────────────────────────────────────────────────────────
// Set ext.jacocoCoverageIncludes in the project build.gradle to filter coverage.
// Defaults to all classes if not set.
ext.jacocoCoverageIncludes = ['com/neasaa/base/app/utils/**']


// ─── release: test + publish ──────────────────────────────────────────────────
tasks.register('release') {
    group = 'release'
    description = 'Compiles, tests, and publishes artifact to Artifactory.'
    dependsOn test
}
